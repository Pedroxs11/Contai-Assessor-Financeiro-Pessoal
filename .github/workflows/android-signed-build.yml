name: Android Signed Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v1-1-beta
    paths:
      - '.github/workflows/android-signed-build.yml'

jobs:
  build-signed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore signing keystore
        env:
          CONTAI_KEYSTORE_BASE64: ${{ secrets.CONTAI_KEYSTORE_BASE64 }}
        run: |
          test -n "$CONTAI_KEYSTORE_BASE64"
          printf '%s' "$CONTAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/contai-upload.p12"

      - name: Detect signing alias
        env:
          CONTAI_STORE_PASSWORD: ${{ secrets.CONTAI_STORE_PASSWORD }}
        run: |
          ALIAS=$(LC_ALL=C keytool -list -v \
            -keystore "$RUNNER_TEMP/contai-upload.p12" \
            -storepass "$CONTAI_STORE_PASSWORD" \
            | sed -n 's/^Alias name: //p' \
            | head -n 1)
          test -n "$ALIAS"
          echo "CONTAI_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          CONTAI_STORE_FILE: ${{ runner.temp }}/contai-upload.p12
          CONTAI_STORE_PASSWORD: ${{ secrets.CONTAI_STORE_PASSWORD }}
          CONTAI_KEY_PASSWORD: ${{ secrets.CONTAI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: contai-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: contai-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
