name: Build signed Android App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets and restore upload keystore
        env:
          CONTAI_KEYSTORE_BASE64: ${{ secrets.CONTAI_KEYSTORE_BASE64 }}
          CONTAI_STORE_PASSWORD: ${{ secrets.CONTAI_STORE_PASSWORD }}
          CONTAI_KEY_ALIAS: ${{ secrets.CONTAI_KEY_ALIAS }}
          CONTAI_KEY_PASSWORD: ${{ secrets.CONTAI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$CONTAI_KEYSTORE_BASE64" ] || fail "CONTAI_KEYSTORE_BASE64 is empty."
          [ -n "$CONTAI_STORE_PASSWORD" ] || fail "CONTAI_STORE_PASSWORD is empty."
          [ -n "$CONTAI_KEY_PASSWORD" ] || fail "CONTAI_KEY_PASSWORD is empty."

          KEYSTORE="${RUNNER_TEMP}/contai-upload.jks"
          printf '%s' "$CONTAI_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE" \
            || fail "CONTAI_KEYSTORE_BASE64 is not valid Base64."
          [ -s "$KEYSTORE" ] || fail "Decoded keystore is empty."

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$CONTAI_STORE_PASSWORD" >/dev/null 2>&1; then
            fail "Keystore could not be opened. Check CONTAI_KEYSTORE_BASE64 and CONTAI_STORE_PASSWORD."
          fi

          RESOLVED_ALIAS="$(keytool -J-Duser.language=en -list -keystore "$KEYSTORE" -storepass "$CONTAI_STORE_PASSWORD" 2>/dev/null \
            | awk -F',' '/PrivateKeyEntry/{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1}')"
          ALIAS_COUNT="$(printf '%s\n' "$RESOLVED_ALIAS" | sed '/^$/d' | wc -l | tr -d ' ')"
          [ "$ALIAS_COUNT" -eq 1 ] || fail "Expected exactly one PrivateKeyEntry in the keystore, found $ALIAS_COUNT."

          echo "CONTAI_RESOLVED_ALIAS=$RESOLVED_ALIAS" >> "$GITHUB_ENV"
          echo "Signing keystore validated and its single key alias resolved automatically."

      - name: Build signed release AAB
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ${{ runner.temp }}/contai-upload.jks
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: ${{ secrets.CONTAI_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: ${{ env.CONTAI_RESOLVED_ALIAS }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: ${{ secrets.CONTAI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Validate AAB package, version and upload certificate
        env:
          CONTAI_STORE_PASSWORD: ${{ secrets.CONTAI_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          AAB="app/build/outputs/bundle/release/app-release.aab"
          KEYSTORE="${RUNNER_TEMP}/contai-upload.jks"
          test -s "$AAB" || fail "Release AAB was not generated."

          python3 - <<'PY'
          import re, zipfile, sys
          aab = "app/build/outputs/bundle/release/app-release.aab"
          with zipfile.ZipFile(aab) as z:
              names = set(z.namelist())
              required = {"base/manifest/AndroidManifest.xml", "META-INF/MANIFEST.MF"}
              missing = sorted(required - names)
              if missing:
                  print("::error::AAB structure is invalid; missing: " + ", ".join(missing))
                  sys.exit(1)
          print("AAB ZIP structure validated.")
          PY

          EXPECTED_PACKAGE="$(grep -RhoE 'namespace[[:space:]]*=?[[:space:]]*["'\'']com\.contai\.financeiro["'\'']|applicationId[[:space:]]+["'\'']com\.contai\.financeiro["'\'']' app/build.gradle* 2>/dev/null | head -1 || true)"
          [ -n "$EXPECTED_PACKAGE" ] || fail "Expected package com.contai.financeiro was not found in app Gradle configuration."

          VERSION_CODE="$(grep -RhoE 'versionCode[[:space:]]*=?[[:space:]]*[0-9]+' app/build.gradle* 2>/dev/null | head -1 | grep -oE '[0-9]+' || true)"
          VERSION_NAME="$(grep -RhoE 'versionName[[:space:]]*=?[[:space:]]*["'\''][^"'\'']+["'\'']' app/build.gradle* 2>/dev/null | head -1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/' || true)"
          [ -n "$VERSION_CODE" ] || fail "versionCode could not be read from app Gradle configuration."
          [ -n "$VERSION_NAME" ] || fail "versionName could not be read from app Gradle configuration."

          keytool -exportcert -keystore "$KEYSTORE" -storepass "$CONTAI_STORE_PASSWORD" -alias "$CONTAI_RESOLVED_ALIAS" -rfc > "${RUNNER_TEMP}/upload-cert.pem"
          SHA256="$(keytool -printcert -file "${RUNNER_TEMP}/upload-cert.pem" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          [ -n "$SHA256" ] || fail "Could not calculate upload certificate SHA-256 fingerprint."

          echo "Package: com.contai.financeiro"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "Upload certificate SHA-256: $SHA256"
          echo "AAB validation passed."

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: contai-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
