name: Build signed Android App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          CONTAI_KEYSTORE_BASE64: ${{ secrets.CONTAI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CONTAI_KEYSTORE_BASE64"
          printf '%s' "$CONTAI_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/contai-upload.jks"
          keytool -list -keystore "${RUNNER_TEMP}/contai-upload.jks" -storepass "${{ secrets.CONTAI_STORE_PASSWORD }}" -alias "${{ secrets.CONTAI_KEY_ALIAS }}" >/dev/null

      - name: Build signed release AAB
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ${{ runner.temp }}/contai-upload.jks
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: ${{ secrets.CONTAI_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: ${{ secrets.CONTAI_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: ${{ secrets.CONTAI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Verify AAB exists
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          echo "Signed AAB generated successfully."
          ls -lh "$AAB"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: contai-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
