name: Build signed Android App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets and restore upload keystore
        env:
          CONTAI_KEYSTORE_BASE64: ${{ secrets.CONTAI_KEYSTORE_BASE64 }}
          CONTAI_STORE_PASSWORD: ${{ secrets.CONTAI_STORE_PASSWORD }}
          CONTAI_KEY_ALIAS: ${{ secrets.CONTAI_KEY_ALIAS }}
          CONTAI_KEY_PASSWORD: ${{ secrets.CONTAI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$CONTAI_KEYSTORE_BASE64" ] || fail "CONTAI_KEYSTORE_BASE64 is empty."
          [ -n "$CONTAI_STORE_PASSWORD" ] || fail "CONTAI_STORE_PASSWORD is empty."
          [ -n "$CONTAI_KEY_ALIAS" ] || fail "CONTAI_KEY_ALIAS is empty."
          [ -n "$CONTAI_KEY_PASSWORD" ] || fail "CONTAI_KEY_PASSWORD is empty."

          KEYSTORE="${RUNNER_TEMP}/contai-upload.jks"
          printf '%s' "$CONTAI_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE" \
            || fail "CONTAI_KEYSTORE_BASE64 is not valid Base64."
          [ -s "$KEYSTORE" ] || fail "Decoded keystore is empty."

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$CONTAI_STORE_PASSWORD" >/dev/null 2>&1; then
            fail "Keystore could not be opened. Check CONTAI_KEYSTORE_BASE64 and CONTAI_STORE_PASSWORD."
          fi

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$CONTAI_STORE_PASSWORD" -alias "$CONTAI_KEY_ALIAS" >/dev/null 2>&1; then
            ALIAS_COUNT="$(keytool -list -keystore "$KEYSTORE" -storepass "$CONTAI_STORE_PASSWORD" 2>/dev/null | grep -c ',.*Entry,' || true)"
            if [ "$ALIAS_COUNT" -eq 1 ]; then
              echo "::error::Keystore opens and contains exactly one key entry, but CONTAI_KEY_ALIAS does not match it. Update only CONTAI_KEY_ALIAS with the keystore alias."
            else
              echo "::error::Keystore opens, but CONTAI_KEY_ALIAS was not found. The keystore reports $ALIAS_COUNT entries; inspect the alias locally before changing the secret."
            fi
            exit 1
          fi

          echo "Signing keystore and alias validated without exposing secret values."

      - name: Build signed release AAB
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ${{ runner.temp }}/contai-upload.jks
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: ${{ secrets.CONTAI_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: ${{ secrets.CONTAI_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: ${{ secrets.CONTAI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Verify AAB exists
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          echo "Signed AAB generated successfully."
          ls -lh "$AAB"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: contai-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
